name: SAST and SCA Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install
    
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: 9ffed23ddbfc11be702fdf38b1efaca366ba439e
      with:
       args: >
          -Dsonar.projectKey=reactapp02
          -Dsonar.projectName=React-projects-for-beginners
          -Dsonar.sources=.
          -Dsonar.exclusions=**/node_modules/**,**/*.css,**/*.svg
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
    
jobs:
  SCA_snyk_scan:
    name: Run Snyk SCA Scan for Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: bb6abd5b-17cb-4c95-892e-9c8243e9777c
        with:
          command: monitor
